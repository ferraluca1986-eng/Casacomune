<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaComune - 7904 REALI TURBO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f0f9ff}.h{background:#fff;padding:10px 14px;display:flex;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08)}#map{height:70vh;margin:10px;border-radius:16px;border:2px solid #fff}.chip{background:#fff;border:1.5px solid #ddd;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;margin:3px;display:inline-block;cursor:pointer}.chip.a{background:#0f2a6b;color:#fff}.b{background:#22c55e;color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}</style>
</head>
<body>
<div class="h"><b>🏠 CasaComune <span style="background:#2563eb;color:#fff;padding:2px 6px;border-radius:6px;font-size:10px">ITALIA 7.904 REALI</span></b><span class="b">Binasco PILOTA 🟢</span></div>
<div style="text-align:center;padding:8px"><h2 style="color:#0f2a6b">Tutti i 7.904 Comuni Reali</h2><p style="font-size:10px;color:#666">ISTAT + coordinate vere • caricamento turbo</p></div>
<div style="text-align:center"><span class="chip a" onclick="f('all',this)">🇮🇹 Tutta Italia</span><span class="chip" onclick="f('Lombardia',this)">Lombardia</span><span class="chip" onclick="f('Lazio',this)">Lazio</span><span class="chip" onclick="f('Campania',this)">Campania</span><input id="q" class="chip" style="min-width:220px" placeholder="🔍 Cerca Comune" oninput="s(this.value)"><span id="cnt" class="chip" style="background:#0f2a6b;color:#fff">⏳ Carico...</span><span class="b" onclick="goB()">📍 Binasco</span></div>
<div id="map"></div>
<script>
const map=L.map('map').setView([41.9,12.5],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const cl=L.markerClusterGroup({chunkedLoading:true}); map.addLayer(cl);
let ALL=[];
async function load(){
 try{
  document.getElementById('cnt').innerText='⏳ Scarico 7904...';
  let r=await fetch('https://raw.githubusercontent.com/napolux/italia/master/comuni/comuni.json');
  let j=await r.json();
  let rr=await fetch('https://raw.githubusercontent.com/napolux/italia/master/regioni/regioni.json').then(x=>x.json());
  let pp=await fetch('https://raw.githubusercontent.com/napolux/italia/master/province/province.json').then(x=>x.json());
  let rm={}; rr.forEach(x=>rm[x.id]=x.nome);
  let pm={}; pp.forEach(x=>pm[x.id]={s:x.sigla,n:x.nome});
  ALL=j.map(c=>{
   let lat=parseFloat(c.latitudine), lng=parseFloat(c.longitudine);
   if(isNaN(lat)) return null;
   return {c:c.nome, p:pm[c.id_provincia]?.s||'', r:rm[c.id_regione]||'', la:lat, lo:lng};
  }).filter(Boolean);
  ok();
 }catch(e){
  console.log('fallback',e);
  document.getElementById('cnt').innerText='⏳ Backup...';
  let j=await fetch('https://cdn.jsdelivr.net/gh/comuni-ita/comuni-ita@main/comuni.json').then(x=>x.json());
  ALL=j.map(c=>({c:c.nome,p:c.provincia?.sigla||'',r:c.regione?.nome||'',la:parseFloat(c.coordinate.lat),lo:parseFloat(c.coordinate.lng)})).filter(x=>!isNaN(x.la));
  ok();
 }
}
function ok(){
 document.getElementById('cnt').innerText='✅ '+ALL.length+' Comuni REALI';
 render(ALL);
}
function render(LIST){
 cl.clearLayers();
 LIST.slice(0,8000).forEach(x=>{
  let isB=x.c.toLowerCase()==='binasco';
  let m=L.circleMarker([x.la,x.lo],{radius:isB?14:4,fillColor:isB?'#22c55e':'#2563eb',color:'#fff',weight:isB?3:1,fillOpacity:.9});
  m.bindPopup(`<b>${x.c} (${x.p})</b><br>${x.r}<br>${isB?'<b style=color:green>🟢 PILOTA BINASCO</b><br>':''}<button style="background:#2563eb;color:#fff;border:none;padding:5px 10px;border-radius:6px">Dashboard</button>`);
  cl.addLayer(m);
 });
}
function f(reg,el){
 document.querySelectorAll('.chip').forEach(x=>{if(x.textContent.includes('Italia')||x.textContent.includes('Lombardia')||x.textContent.includes('Lazio')||x.textContent.includes('Campania')) x.classList.remove('a')});
 if(el) el.classList.add('a');
 if(reg==='all'){ render(ALL); map.setView([41.9,12.5],6); return; }
 let F=ALL.filter(x=>x.r.toLowerCase().includes(reg.toLowerCase()));
 render(F); if(F[0]) map.setView([F[0].la,F[0].lo],7);
}
function s(q){ if(!q||q.length<2){render(ALL); return;} let F=ALL.filter(x=>x.c.toLowerCase().includes(q.toLowerCase())).slice(0,1000); render(F); if(F[0]) map.setView([F[0].la,F[0].lo], F.length===1?12:8); }
function goB(){ let b=ALL.find(x=>x.c.toLowerCase()==='binasco'); if(b) map.setView([b.la,b.lo],14); else map.setView([45.3333,9.1],13); }
load();
</script>
</body>
</html>
