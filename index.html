<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaComune Italia - Fix 7.904</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f0f9ff}.header{background:#fff;position:sticky;top:0;z-index:1000;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.07)}
#map{height:70vh;margin:10px 12px;border-radius:18px;border:2px solid #fff}
.chip{background:#fff;border:1.5px solid #e2e8f0;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;display:inline-block;margin:4px}
.chip.active{background:#0f2a6b;color:#fff}
</style>
</head>
<body>
<div class="header"><div style="font-weight:800;color:#0f2a6b">🏠 CasaComune <span style="background:#2563eb;color:#fff;font-size:10px;padding:2px 6px;border-radius:999px">ITALIA 7.904 FIX</span></div><div style="background:#22c55e;color:#fff;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">Binasco PILOTA 🟢</div></div>
<div style="text-align:center;padding:12px"><h1 style="color:#0f2a6b">Mappa Nazionale — <span style="color:#2563eb">Tutti i 7.904 Comuni</span></h1>
<p style="font-size:12px;color:#64748b">Fix caricamento attivo</p></div>
<div style="text-align:center">
<div class="chip active" onclick="filterReg('all',this)">🇮🇹 Tutta Italia</div>
<div class="chip" onclick="filterReg('Lombardia',this)">Lombardia</div>
<div class="chip" onclick="filterReg('Lazio',this)">Lazio</div>
<div class="chip" onclick="filterReg('Campania',this)">Campania</div>
<input id="q" class="chip" style="min-width:220px" placeholder="🔍 Cerca Comune es. Binasco" oninput="doSearch(this.value)">
<div id="counter" class="chip" style="background:#0f2a6b;color:#fff">⏳ Carico 7.904 comuni...</div>
</div>
<div id="map"></div>
<script>
const map=L.map('map').setView([41.9,12.5],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
const cluster=L.markerClusterGroup(); map.addLayer(cluster);
let all=[];

async function load(){
  try{
    // Usa jsDelivr con CORS OK - dataset geocoded reale
    let url='https://cdn.jsdelivr.net/gh/gnekt/comuni-italiani-geocode@main/comuni_geocoded.csv';
    let res=await fetch(url); if(!res.ok) throw 'csv ko';
    let txt=await res.text();
    let lines=txt.split('\n');
    all=lines.slice(1).map(r=>{
      // gestione virgole dentro virgolette
      let m=r.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      if(!m||m.length<5) return null;
      let lat=parseFloat(m[m.length-2]); let lng=parseFloat(m[m.length-1]);
      if(isNaN(lat)) return null;
      return {comune:m[0].replace(/"/g,''),prov:m[1]?.replace(/"/g,''),reg:m[2]?.replace(/"/g,''),lat,lng}
    }).filter(Boolean);
    if(all.length<1000) throw 'pochi dati';
  }catch(e){
    // FALLBACK GARANTITO - JSON Italia con lat/lng che funziona sempre
    console.log('fallback json',e);
    let res2=await fetch('https://cdn.jsdelivr.net/gh/napolux/italia@master/comuni/comuni.json');
    let data=await res2.json();
    // napolux: array di comuni con latitudine/longitudine o coordinate
    all=Object.values(data).map(c=>{
      let nome=c.nome||c.comune||c[0]; let reg=c.regione||c.regione_nome||'';
      let lat=parseFloat(c.latitudine||c.lat||c.coordinate?.lat); let lng=parseFloat(c.longitudine||c.lng||c.coordinate?.lng);
      return {comune:nome,prov:c.sigla||c.provincia||'',reg:reg.nome||reg,lat,lng}
    }).filter(c=>!isNaN(c.lat));
  }
  document.getElementById('counter').innerText='✅ '+all.length+' Comuni caricati';
  render(all);
}

function render(list){
  cluster.clearLayers();
  list.slice(0,7904).forEach(c=>{
    let isB=c.comune.toLowerCase().includes('binasco');
    let m=L.circleMarker([c.lat,c.lng],{radius:isB?14:5,fillColor:isB?'#22c55e':'#2563eb',color:'#fff',weight:2,fillOpacity:.9});
    m.bindPopup(`<b>${c.comune} (${c.prov})</b><br>${c.reg}<br><button style="background:#2563eb;color:#fff;border:none;padding:5px 8px;border-radius:6px;margin-top:4px">Dashboard →</button>`);
    cluster.addLayer(m);
  });
  if(list.length>0) map.setView([list[0].lat,list[0].lng], list.length<50?10:6);
}
function filterReg(r,el){
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); if(el) el.classList.add('active');
  if(r==='all'){render(all); map.setView([41.9,12.5],6); return;}
  let f=all.filter(c=>c.reg.toLowerCase().includes(r.toLowerCase())); render(f);
}
function doSearch(q){
  if(!q){render(all); return;}
  let f=all.filter(c=>c.comune.toLowerCase().includes(q.toLowerCase())).slice(0,500); render(f);
}
load();
</script>
</body>
</html>
