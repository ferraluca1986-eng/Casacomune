<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaComune - Binasco | Segnalazioni ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui;padding:20px;max-width:600px;margin:auto} .card{border:1px solid #ddd;padding:15px;border-radius:10px;margin:10px 0} button{background:#0a7d33;color:white;padding:12px 18px;border:0;border-radius:8px;width:100%} </style>
</head>
<body>
<h1>CasaComune - Comune di Binasco</h1>
<p id="contatori">Caricamento dati reali da database...</p>

<div id="form-inquilino" class="card">
<h3>🏠 Inquilino - Segnala guasto</h3>
<select id="tipo"><option>Perdita acqua</option><option>Ascensore bloccato</option><option>Luce scala</option><option>Porta / Serratura</option><option>Riscaldamento</option><option>Altro</option></select>
<textarea id="desc" placeholder="Descrivi - Via, interno, cosa succede"></textarea>
<button onclick="inviaSegnalazione()">Invia segnalazione al Comune</button>
<p style="font-size:11px">Dati salvati in UE (Frankfurt) - GDPR - Informativa art.13 disponibile presso Ufficio Casa</p>
</div>

<div id="login-operatore" class="card">
<h3>🔑 Area Operatore / Dirigente</h3>
<input id="email" placeholder="email comunale">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Entra</button>
</div>

<script>
const SUPABASE_URL = "INSERISCI_QUI_URL_DEL_NUOVO_PROGETTO_FRANKFURT";
const SUPABASE_KEY = "INSERISCI_QUI_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function caricaContatori(){
  const {count} = await sb.from('segnalazioni').select('*', {count:'exact', head:true});
  document.getElementById('contatori').innerText = `Segnalazioni totali nel sistema: ${count ?? 0} - Dati reali`;
}
async function inviaSegnalazione(){
  const tipo = document.getElementById('tipo').value;
  const desc = document.getElementById('desc').value;
  if(!desc) return alert('Inserisci via e descrizione');
  const {error} = await sb.from('segnalazioni').insert({comune_id:'binasco', via:desc, tipo_guasto:tipo, descrizione:desc, stato:'aperta'});
  if(error) alert(error.message); else { alert('Segnalazione inviata! L\'operatore la vedrà subito.'); caricaContatori(); }
}
async function login(){
  const {error} = await sb.auth.signInWithPassword({email:email.value, password:pass.value});
  if(error) alert(error.message); else alert('Login ok - ora puoi gestire le pratiche');
}
caricaContatori();
</script>
</body>
</html>
