<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaComune - Comune di Binasco</title>
<style>
 body{font-family:system-ui, -apple-system; margin:0; background:#f3f4f6; padding:16px}
 .card{background:white; padding:18px; border-radius:12px; max-width:520px; margin:16px auto; box-shadow:0 2px 8px rgba(0,0,0,0.08); border:1px solid #e5e7eb}
 button{padding:12px 14px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:8px}
 .btn-green{background:#16a34a; color:white; width:100%}
 .btn-blue{background:#2563eb; color:white; width:100%}
 .btn-whatsapp{background:#25D366; color:white; width:100%; font-size:15px}
 .btn-gray{background:#e5e7eb; color:#111}
 .btn-small{padding:7px 11px; font-size:13px; width:auto; margin-right:6px}
 .btn-red{background:#fee2e2; color:#b91c1c; width:auto; padding:7px 11px; font-size:13px}
 input, textarea, select{width:100%; padding:11px; margin:6px 0; border:1px solid #d1d5db; border-radius:8px; box-sizing:border-box; font-size:15px}
 .tab{display:flex; gap:6px; margin:12px auto; justify-content:center; flex-wrap:wrap; max-width:520px}
 small{color:#6b7280; font-size:11.5px; display:block; margin-top:10px; line-height:1.4}
 .badge{font-size:11px; padding:3px 8px; border-radius:999px; display:inline-block; font-weight:bold}
 .b-aperta{background:#fef9c3; color:#854d0e} .b-inoltrata{background:#dbeafe; color:#1e40af} .b-chiusa{background:#dcfce7; color:#166534}
 .item{border:1px solid #eee; padding:12px; margin:10px 0; border-radius:10px; background:#fff}
 .statbox{display:flex; gap:8px; margin:10px 0}
 .stat{flex:1; background:#f9fafb; border:1px solid #eee; border-radius:8px; padding:8px; text-align:center; font-size:13px}
 .stat b{font-size:18px; display:block}
</style>
</head>
