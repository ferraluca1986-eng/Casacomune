<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 CasaComune</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.h{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
#map{height:62vh;width:100%}
.bar{padding:10px;display:flex;gap:8px;background:#f5f5f5}
.bar input,.bar select{flex:1;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}
.btn{padding:12px 16px;background:#111;color:#fff;border-radius:10px;border:0}
#list{padding:10px;display:grid;gap:8px;max-height:38vh;overflow:auto;background:#fff}
.card{padding:12px;border:1px solid #eee;border-radius:12px;display:flex;justify-content:space-between}
#status{text-align:center;padding:6px;background:#fffbe6;font-size:13px}
</style>
</head>
<body>
<div class="h"><div><b>🏠 CasaComune</b> <small>Italia</small></div><div id="count">...</div></div>
<div id="status">Carico comuni...</div>
<div class="bar">
<input id="q" placeholder="Cerca comune... es. Binasco" oninput="searchQ(this.value)">
<select id="reg" onchange="filt(this.value)"><option value="">Tutte regioni</option></select>
<button class="btn" onclick="goB()">📍</button>
</div>
<div id="map"></div>
<div id="list"></div>

<script>
const map=L.map('map').setView([41.9,12.5],5.5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
const cl=L.markerClusterGroup({chunkedLoading:true}).addTo(map);
let DATA=[], VIEW=[];

async function load(){
 try{
  let comuniNomi = await fetch('https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json').then(r=>r.json());
  DATA = comuniNomi.map(c=>{
    let reg = c.regione?.nome || c.regione || "Lombardia";
    let lat = c.coordinate? c.coordinate.lat : (c.lat || 0);
    let lng = c.coordinate? c.coordinate.lng : (c.lng || c.lon || 0);
    if(!lat){
      let base={Lombardia:[45.5,9.5],Lazio:[41.9,12.5],Sicilia:[37.5,14],Campania:[40.8,14.3],Veneto:[45.6,11.8],Piemonte:[45,7.8]};
      let b=base[reg]||[41.9,12.5];
      lat=b[0]+(Math.random()-0.5)*1.5; lng=b[1]+(Math.random()-0.5)*2;
    }
    return [c.nome, c.sigla||c.provincia?.sigla||"", reg, lat, lng];
  });
  document.getElementById('status').innerText = DATA.length+" comuni caricati";
  initReg(); render(DATA);
 }catch(e){
  document.getElementById('status').innerText = "Modalità offline";
  let fallback=[["Binasco","MI","Lombardia",45.33,9.10],["Milano","MI","Lombardia",45.46,9.19],["Roma","RM","Lazio",41.89,12.49],["Napoli","NA","Campania",40.85,14.26]];
  DATA=fallback; render(DATA);
 }
}
function initReg(){
 let regs=[...new Set(DATA.map(d=>d[2]))].sort();
 let sel=document.getElementById('reg');
 regs.forEach(r=>{let o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);});
}
function render(list){
 cl.clearLayers(); VIEW=list; document.getElementById('count').innerText=list.length;
 let html="";
 list.slice(0,150).forEach(c=>{
  let m=L.marker([c[3],c[4]]).bindPopup(`<b>${c[0]}</b><br>${c[1]} - ${c[2]}`);
  cl.addLayer(m);
  html+=`<div class="card"><div><b>${c[0]}</b> <small>${c[1]}</small><br><small>${c[2]}</small></div><div><button class="btn" onclick="map.setView([${c[3]},${c[4]}],12)">Vai</button></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
 if(list.length>0){ try{map.fitBounds(cl.getBounds(),{padding:[20,20]});}catch{} }
}
function filt(reg){ if(!reg) render(DATA); else render(DATA.filter(d=>d[2]==reg)); }
function searchQ(q){
 if(!q||q.length<1){render(DATA);return;}
 q=q.toLowerCase(); render(DATA.filter(d=>d[0].toLowerCase().includes(q)));
}
function goB(){ if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(p=>{ map.setView([p.coords.latitude,p.coords.longitude],11); L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup("Sei qui").openPopup(); }); } }
load();
</script>
</body>
</html>
