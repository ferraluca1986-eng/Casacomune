<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casacomune Binasco</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><h2>Casacomune Binasco - Frankfurt LIVE ✅</h2><div id="status">Connessione...</div><input id="titolo" placeholder="Titolo"><input id="indirizzo" placeholder="Indirizzo Binasco"><button onclick="add()">Salva su Francoforte</button><div id="lista"></div><script>const URL="https://uoothklvwjgijgxripit.supabase.co";const KEY="sb_publishable_g7aZm142THA8ia8MJX0dyg_vx3sEANm";const sb=supabase.createClient(URL,KEY);async function load(){let {data}=await sb.from('alloggi').select('*').order('created_at',{ascending:false});document.getElementById('lista').innerHTML=data.map(r=>`<div>${r.titolo} - ${r.indirizzo}</div>`).join('');document.getElementById('status').innerHTML="✅ Connesso a Francoforte - "+data.length+" record";}async function add(){let t=document.getElementById('titolo').value;let i=document.getElementById('indirizzo').value;await sb.from('alloggi').insert([{titolo:t,indirizzo:i}]);load();}load();</script></body></html>
