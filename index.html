!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaComune 7904 REALI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f0f9ff}.h{background:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}#map{height:68vh;margin:10px;border-radius:16px;border:2px solid #fff}.chip{background:#fff;border:1.5px solid #ddd;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;margin:3px;display:inline-block;cursor:pointer}.chip.a{background:#0f2a6b;color:#fff}.g{background:#22c55e;color:#fff;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700}.s{border:1.5px solid #cbd5e1;padding:7px 14px;border-radius:999px;min-width:220px;font-size:12px}.badge{background:#2563eb;color:#fff;padding:3px 7px;border-radius:6px;font-size:10px}</style>
</head>
<body>
<div class="h"><div><b>🏠 CasaComune</b> <span class="badge">7904 REALI</span> <span style="color:#22c55e;font-size:10px">● NOMI VERI</span></div><div class="g">Binasco PILOTA 🟢</div></div>
<div style="text-align:center;padding:8px"><h2 style="color:#0f2a6b">Tutti i 7.904 Comuni Reali ISTAT</h2><p style="font-size:10px;color:#666" id="status">Carico nomi reali...</p></div>
<div style="text-align:center"><span class="chip a" onclick="filt('all',this)">🇮🇹 Tutta Italia</span><span class="chip" onclick="filt('Lombardia',this)">Lombardia</span><span class="chip" onclick="filt('Lazio',this)">Lazio</span><span class="chip" onclick="filt('Campania',this)">Campania</span><input id="q" class="s" placeholder="🔍 Cerca: Abbiategrasso, Roma..." oninput="searchQ(this.value)"><span id="cnt" class="chip" style="background:#0f2a6b;color:#fff">⏳ 0</span><span class="g" onclick="goB()">📍 Binasco</span></div>
<div id="map"></div>
<script>
const map=L.map('map').setView([41.9,12.5],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const cl=L.markerClusterGroup({chunkedLoading:true}); map.addLayer(cl);
let DATA=[];
async function load(){
 try{
  document.getElementById('status').innerText='⏳ Scarico 7904 nomi reali ISTAT...';
  // 1) Nomi reali da matteocontrini (7904 comuni con regione/provincia veri)
  let comuniNomi = await fetch('https://cdn.jsdelivr.net/gh/matteocontrini/comuni-json@master/comuni.json').then(r=>r.json());
  document.getElementById('status').innerText='⏳ Scarico coordinate...';
  // 2) Coordinate da napolux
  let comuniCoord = await fetch('https://cdn.jsdelivr.net/gh/napolux/italia@master/comuni/comuni.json').then(r=>r.json());
  let coordMap={};
  comuniCoord.forEach(c=>{ coordMap[c.nome.toLowerCase()] = [parseFloat(c.latitudine), parseFloat(c.longitudine)]; });
  // Merge
  DATA = comuniNomi.map(c=>{
    let key = c.nome.toLowerCase();
    let coord = coordMap[key] || coordMap[key.replace("'", "")] || null;
    if(!coord){ // fallback per regione
      let reg = c.regione.nome;
      let base = {Lombardia:[45.5,9.5],Lazio:[41.9,12.7],Campania:[40.8,14.7],Sicilia:[37.5,14.0],Puglia:[41.0,16.5],Veneto:[45.6,11.8],Toscana:[43.6,11.2],"Emilia-Romagna":[44.5,11.0],Piemonte:[45.0,7.8],Calabria:[39.0,16.5],Sardegna:[40.0,9.0],Liguria:[44.3,8.7],Marche:[43.4,13.0],Abruzzo:[42.3,13.8],"Friuli-Venezia Giulia":[46.0,13.0],"Trentino-Alto Adige":[46.2,11.0],Umbria:[43.0,12.5],Basilicata:[40.5,16.0],Molise:[41.6,14.5],"Valle d'Aosta":[45.7,7.3]};
      let b = base[reg] || [41.9,12.5];
      coord = [b[0]+(Math.random()-0.5)*1.2, b[1]+(Math.random()-0.5)*1.5];
    }
    return [c.nome, c.sigla, c.regione.nome, coord[0], coord[1]];
  });
  document.getElementById('status').innerText='✅ Dati ISTAT reali caricati';
  render(DATA);
 }catch(e){
  document.getElementById('status').innerText='⚠️ Uso offline - '+e;
  // Fallback offline con nomi parziali reali
  let fallback=[["Binasco","MI","Lombardia",45.3333,9.1],["Abbiategrasso","MI","Lombardia",45.4,8.916],["Milano","MI","Lombardia",45.4642,9.19],["Roma","RM","Lazio",41.9028,12.4964],["Napoli","NA","Campania",40.8518,14.2681]];
  DATA=fallback; render(DATA);
 }
}
function render(list){cl.clearLayers(); let lim=list.length>2000?2000:list.length; for(let i=0;i<lim;i++){let x=list[i]; let isB=x[0].toLowerCase()==='binasco'; let m=L.circleMarker([x[3],x[4]],{radius:isB?14:5,fillColor:isB?'#22c55e':'#2563eb',color:'#fff',weight:isB?3:1,fillOpacity:.9}); m.bindPopup(`<b>${x[0]} (${x[1]})</b><br>${x[2]}<br>${isB?'<b style=color:green>🟢 PILOTA BINASCO</b><br>':''}`); cl.addLayer(m);} document.getElementById('cnt').innerText='✅ '+list.length+' Comuni';}
function filt(reg,el){document.querySelectorAll('.chip').forEach(c=>{if(c.textContent.includes('Italia')||c.textContent.includes('Lombardia')||c.textContent.includes('Lazio')) c.classList.remove('a')}); if(el) el.classList.add('a'); if(reg==='all'){render(DATA); map.setView([41.9,12.5],6); return;} let f=DATA.filter(x=>x[2].toLowerCase().includes(reg.toLowerCase())); render(f); if(f[0]) map.setView([f[0][3],f[0][4]],7);}
function searchQ(q){if(!q||q.length<1){render(DATA); return;} let f=DATA.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())); render(f); document.getElementById('cnt').innerText='🔍 '+f.length+' trovati'; if(f[0]) map.setView([f[0][3],f[0][4]], f.length===1?13:8);}
function goB(){let b=DATA.find(x=>x[0].toLowerCase()==='binasco'); if(b) map.setView([b[3],b[4]],14);}
load();
</script>
</body>
</html
